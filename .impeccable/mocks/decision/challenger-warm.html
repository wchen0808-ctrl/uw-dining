<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden}
body{background:#f6efe6;font:15px/1.45 "PingFang SC",system-ui,sans-serif;color:#2b2622;position:relative}
.bar{padding:16px 18px 6px;font-size:22px;font-weight:700}
.sub{padding:0 18px 12px;color:#7a6d61}
.card{background:#fff;border-radius:22px;margin:0 16px 12px;padding:16px}
.hero{display:flex;gap:12px;align-items:center}
.egg{flex:none;width:64px;height:78px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:#f6b81f}
.hero h1{margin:0;font-size:20px}.hero p{margin:2px 0 0;color:#7a6d61;font-size:14px}
.btn{margin-top:12px;background:#c5050c;color:#fff;border-radius:14px;text-align:center;padding:11px;font-weight:700}
.row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #f0e8de}
.row:first-of-type{border-top:0}.row small{color:#7a6d61}
.days{display:flex;gap:6px}.days span{flex:1;text-align:center;border-radius:12px;padding:8px 0;background:#f6efe6;font-size:13px}
.days span.on{background:#2b2622;color:#fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;display:flex;justify-content:space-around;padding-top:12px;color:#7a6d61;font-size:12px}
.tabbar span.on{color:#c5050c;font-weight:700}
</style></head><body>
<div class="bar">今晚吃什么</div>
<div class="sub">11月18日 周三 · 晚餐</div>
<div class="card">
  <div class="hero"><div class="egg"></div><div><h1>去 Rheta's Market</h1><p>泰式烧烤猪排骨、鸡肉锅派配司康饼、香辣脆皮鸡三明治</p></div></div>
  <div class="btn">看 Rheta's 菜单</div>
</div>
<div class="card"><div class="days"><span class="on">今天</span><span>四</span><span>五</span><span>六</span><span>日</span><span>一</span><span>二</span></div></div>
<div class="card">
  <div class="row"><b>Rheta's</b><small>3 道硬菜</small></div>
  <div class="row"><b>Carson's</b><small>3 道硬菜</small></div>
  <div class="row"><b>Gordon</b><small>2 道硬菜</small></div>
  <div class="row"><b>Four Lakes</b><small>2 道硬菜</small></div>
</div>
<div class="tabbar"><span class="on">今天</span><span>地图</span><span>搜索</span></div>
</body></html>
