<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden}
body{background:#fff4d6;font:15px/1.4 "PingFang SC",system-ui,sans-serif;color:#2b1d12}
.r{font-family:"Baloo 2",system-ui,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.bar b{font-size:20px}.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:600}
.machine{margin:4px 18px 0;background:#c5050c;border-radius:36px 36px 22px 22px;padding:18px;color:#fff;position:relative;height:330px}
.dome{background:#fff;border-radius:999px 999px 28px 28px;height:190px;position:relative;overflow:hidden}
.cap{position:absolute;width:62px;height:62px;border-radius:50%;border:4px solid #fff;box-shadow:inset 0 -28px 0 rgba(255,255,255,.65)}
.knob{position:absolute;left:24px;bottom:22px;width:64px;height:64px;border-radius:50%;background:#ffcf3a;border:6px solid #fff}
.slot{position:absolute;right:22px;bottom:18px;width:150px;height:82px;background:#7a0307;border-radius:20px}
.egg{position:absolute;right:50px;bottom:30px;width:56px;height:68px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:#f6b81f}
.result{margin:-24px 18px 0;position:relative;background:#fff;border-radius:28px;padding:18px 18px 16px;border:3px solid #2b1d12}
.result h1{margin:0 0 4px;font-size:25px}.result p{margin:0 0 10px;color:#6a5643}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#fff4d6;border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px}
.go{margin-top:12px;background:#2b1d12;color:#fff;border-radius:999px;text-align:center;padding:11px;font-weight:700}
.halls{display:flex;gap:8px;margin:14px 18px 0}
.halls span{flex:1;text-align:center;border-radius:999px;padding:8px 0;font-weight:700;font-size:13px}
</style></head><body>
<div class="bar"><b>UW 食堂扭蛋</b><span class="pill">今天 · 晚餐</span></div>
<div class="machine">
  <div class="dome">
    <div class="cap" style="left:20px;top:96px;background:#ffcf3a"></div>
    <div class="cap" style="left:84px;top:118px;background:#6fcf97"></div>
    <div class="cap" style="left:150px;top:100px;background:#5fb4ff"></div>
    <div class="cap" style="left:214px;top:120px;background:#ff8fa3"></div>
    <div class="cap" style="left:118px;top:50px;background:#c5050c"></div>
  </div>
  <div class="knob"></div><div class="slot"></div><div class="egg"></div>
</div>
<div class="result">
  <h1>扭到了：Rheta's！</h1>
  <p>今晚硬菜最多，奶娃说就去这儿</p>
  <div class="chips"><span>泰式烧烤猪排骨</span><span>鸡肉锅派</span><span>香辣脆皮鸡三明治</span></div>
  <div class="go">再扭一次 · 看完整菜单</div>
</div>
<div class="halls r">
  <span style="background:#ffcf3a">Carson's</span><span style="background:#6fcf97">4 Lakes</span><span style="background:#5fb4ff">Gordon</span><span style="background:#ff8fa3">Liz's</span>
</div>
</body></html>
